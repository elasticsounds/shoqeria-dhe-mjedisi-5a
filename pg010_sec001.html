<link href="./content/tailwind_output.css" rel="stylesheet"><link href="./assets/libs/fontawesome/css/all.min.css" rel="stylesheet"><link href="./assets/fonts.css" rel="stylesheet"><link rel="stylesheet" href="./book-design/components.css?v=2bf3d91c0eef6b2b" data-book-style="true">
<style>
/* Page 10 · Provoje veten. Same system as pages 7–9: Poppins only; 32 title · 22 instruction · 20 labels, inputs and folio. Phones: 26 · 20 · 20.
   Desktop: fields sit inside the butterfly's panels, positioned as % of the artwork (measured from the art). Below 900px: artwork, then a field list. */
#content.book.p10{padding:0 56px 128px;max-width:1000px;font-family:var(--book-heading);color:var(--book-ink)}
#content.book.p10>section{padding:0}
#content.book.p10 :is(h1,p,span,label){font-family:var(--book-heading);letter-spacing:0}
#content.book.p10 .p10-instruction{margin:0 0 24px;font:400 22px/1.5 var(--book-heading)}
#content.book.p10 .p10-diagram{position:relative;width:760px;max-width:100%;margin:0 auto}
#content.book.p10 .p10-art{display:block;width:100%;height:auto;max-width:none;margin:0}
#content.book.p10 .p10-field{position:absolute;left:var(--x);top:var(--y);width:var(--w);display:flex;flex-direction:column;align-items:center;gap:8px}
/* Inline pill, not flex: the glossary wraps words in spans and flex would remove the spaces between them. */
#content.book.p10 .p10-label{display:block;max-width:100%;margin:0;padding:4px 14px;border:2px solid var(--book-ink);border-radius:12px;background:#fff;color:var(--book-ink);font:600 20px/1.25 var(--book-heading);text-align:center;text-wrap:balance}
#content.book.p10 .p10-field .p10-input{display:block;width:100%;height:48px;min-height:48px;margin:0;padding:0 12px;border:2px solid #6d6472;border-radius:10px;background:#fff;color:var(--book-ink);font:400 20px/44px var(--book-heading);box-shadow:none;resize:none;overflow:hidden}
#content.book.p10 .p10-field .p10-input:focus-visible{outline:3px solid #075a70;outline-offset:2px;border-color:#075a70}
#content.book.p10 .p10-on-sign{gap:4px}
@media(max-width:900px){
 #content.book.p10 .p10-diagram{width:auto}
 #content.book.p10 .p10-art{width:100%;max-width:420px;margin:0 auto 24px}
 #content.book.p10 .p10-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 16px}
 #content.book.p10 .p10-field{position:static;width:auto;align-items:stretch}
 #content.book.p10 .p10-label{padding:0;border:0;background:none;text-align:left;text-wrap:wrap}
}
@media(max-width:700px){
 #content.book.p10{padding:0 20px 120px}
 #content.book.p10 .p10-instruction{font-size:20px}
}
@media(max-width:520px){#content.book.p10 .p10-fields{grid-template-columns:1fr}}
</style></head>
