<style>
/* Page 11 · exercise 3. Same system as the table above: Poppins only; 22 instruction · 22 card heading · 20 numbers. Phones: 20.
   Five radios (1 yll … 5 yje) drawn as stars; the chosen star and every star before it fill gold. */
#content.book.p11s{--p11s-ink:#794282;--p11s-gold:#ffc23d;--p11s-gold-edge:#b07800;padding:48px 56px 128px;max-width:1000px;font-family:var(--book-heading);color:var(--book-ink)}
#content.book.p11s>section{padding:0}
#content.book.p11s :is(p,span,b,label){font-family:var(--book-heading);letter-spacing:0}
#content.book.p11s .p11s-instruction{margin:0 0 24px;font:400 22px/1.5 var(--book-heading)}
#content.book.p11s .p11s-card{max-width:760px;margin:0 auto;border:2px solid var(--p11s-ink);border-radius:20px;overflow:hidden;background:#fff}
#content.book.p11s .p11s-caption{margin:0;padding:18px 24px;background:var(--p11s-ink);color:#fff;text-align:center;font:600 22px/1.4 var(--book-heading)}
#content.book.p11s .p11s-stars{display:flex;justify-content:center;gap:14px;margin:0;padding:32px 20px 28px;border:0}
#content.book.p11s .p11s-option{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;margin:0;padding:6px;border-radius:16px;cursor:pointer;font-size:20px}
#content.book.p11s .p11s-option input{position:absolute;inset:0;width:100%;height:100%;min-height:0;margin:0;opacity:0;cursor:pointer}
#content.book.p11s .p11s-star{width:72px;height:72px;display:block;fill:#fff;stroke:#8c7a99;stroke-width:1.4;stroke-linejoin:round;transition:fill .15s,stroke .15s,transform .15s}
#content.book.p11s .p11s-num{font:600 20px/1 var(--book-heading);color:var(--book-ink)}
/* hover preview: the hovered star and the ones before it */
#content.book.p11s .p11s-stars:hover .p11s-option:is(:hover,:has(~ .p11s-option:hover)) .p11s-star{fill:#ffe7a8;stroke:var(--p11s-gold-edge)}
/* chosen: the checked star and the ones before it */
#content.book.p11s .p11s-option:is(:has(input:checked),:has(~ .p11s-option input:checked)) .p11s-star{fill:var(--p11s-gold);stroke:var(--p11s-gold-edge)}
#content.book.p11s .p11s-option:has(input:checked) .p11s-star{transform:scale(1.08)}
#content.book.p11s .p11s-option:has(input:focus-visible){outline:3px solid #075a70;outline-offset:2px}
@media(prefers-reduced-motion:reduce){#content.book.p11s .p11s-star{transition:none}#content.book.p11s .p11s-option:has(input:checked) .p11s-star{transform:none}}
@media(max-width:700px){
 #content.book.p11s{padding:32px 20px 120px}
 #content.book.p11s :is(.p11s-instruction,.p11s-caption){font-size:20px}
 #content.book.p11s .p11s-stars{gap:4px;padding:24px 8px 20px}
 #content.book.p11s .p11s-option{padding:4px}
 #content.book.p11s .p11s-star{width:52px;height:52px}
}
</style></head>
