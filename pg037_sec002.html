<script>
/* Page 37 crossword as fill-in-the-blank: the student types each whole word; it is checked as they type and drawn into the grid.
   Answer key (derived from the PDF grid: row lengths in Albanian letters, coloured column spells USHQIMI):
   BUKA/BUKË, TURSHI, QUMËSHTI, FLIJA, MISHI, KUZHINA/KUZHINË. Digraphs (SH, ZH …) are one letter, one cell. */
(function(){
  var KEY=[['BUKA','BUKË'],['TURSHI'],['QUMËSHTI'],['FLIJA'],['MISHI'],['KUZHINA','KUZHINË']];
  var ROWS=[[2,4],[0,5],[3,7],[1,5],[3,4],[0,6]], COL=3, HIDDEN='USHQIMI';
  var DIG=['DH','GJ','LL','NJ','RR','SH','TH','XH','ZH'];
  var grid=document.getElementById('p37-grid'); if(!grid||grid.dataset.ready) return; grid.dataset.ready='1';
  function units(s){s=(s||'').toUpperCase().replace(/[^A-ZÇË]/g,'');var out=[];for(var i=0;i<s.length;){var two=s.substr(i,2);if(DIG.indexOf(two)>=0){out.push(two);i+=2}else{out.push(s[i]);i++}}return out}
  function plain(s){return s.replace(/Ë/g,'E').replace(/Ç/g,'C')}
  var cells=[];
  ROWS.forEach(function(spec,r){var row=document.createElement('div');row.className='p37-row';
    var num=document.createElement('span');num.className='p37-num';num.textContent=(r+1)+'.';num.style.gridColumn=String(spec[0]+1);row.appendChild(num);cells[r]=[];
    for(var i=0;i<spec[1];i++){var c=document.createElement('span');c.className='p37-cell'+(spec[0]+i===COL?' is-col':'');c.style.gridColumn=String(spec[0]+i+2);row.appendChild(c);cells[r].push(c)}
    grid.appendChild(row)});
  var reveal=document.getElementById('p37-reveal');
  function check(n){
    var input=document.getElementById('fjala-'+n), li=input.closest('.p37-word'), status=document.getElementById('fjala-'+n+'-status');
    var u=units(input.value), want=ROWS[n-1][1], word=u.join(''), ok=KEY[n-1].indexOf(word)>=0;
    cells[n-1].forEach(function(c,i){c.textContent=u[i]||''});
    grid.children[n-1].classList.toggle('is-ok',ok);
    li.classList.remove('is-ok','is-almost','is-wrong');var msg='';
    if(ok){li.classList.add('is-ok');msg='✓ Saktë!'}
    else if(u.length>=want){
      if(KEY[n-1].some(function(k){return plain(k)===plain(word)})){li.classList.add('is-almost');msg='Pothuajse! Kontrollo shkronjat ë dhe ç.'}
      else{li.classList.add('is-wrong');msg=u.length>want?'Fjala ka '+want+' shkronja. Provo përsëri.':'Provo përsëri.'}
    }
    if(status.textContent!==msg)status.textContent=msg;
    return ok;
  }
  function all(){var solved=0;for(var n=1;n<=6;n++)if(check(n))solved++;
    var t=solved===6?'Bravo! Në kolonën me ngjyrë zbulove fjalën: '+HIDDEN+'.':'';if(reveal.textContent!==t)reveal.textContent=t}
  document.querySelector('.p37-words').addEventListener('input',function(e){if(e.target.classList.contains('p37-word-input'))all()});
  document.addEventListener('adt:response-restored',function(e){if(e.target.classList&&e.target.classList.contains('p37-word-input'))all()});
  all();
})();
</script>
