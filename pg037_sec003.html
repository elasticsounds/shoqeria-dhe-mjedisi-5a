 <p class="prx-instruction" id="p37-prompt-three"><span data-id="pg037_n0090">3.</span> <span data-id="pg037_n0091">Në kolonën me ngjyrë zbulove një fjalë.</span> <span data-id="pg037_n0092">Shkruaj për rëndësinë e asaj gjëje.</span></p>

<script>
/* Shows the coloured-column word from the crossword (previous section), letter by letter as the student solved it. */
(function(){
  var box=document.getElementById('p37-found'); if(!box) return;
  var KEY=[['BUKA','BUKË'],['TURSHI'],['QUMËSHTI'],['FLIJA'],['MISHI'],['KUZHINA','KUZHINË']], LET=['U','SH','Q','I','M','I'];
  var DIG=['DH','GJ','LL','NJ','RR','SH','TH','XH','ZH'];
  function units(s){s=(s||'').toUpperCase().replace(/[^A-ZÇË]/g,'');var o=[];for(var i=0;i<s.length;){var t=s.substr(i,2);if(DIG.indexOf(t)>=0){o.push(t);i+=2}else{o.push(s[i]);i++}}return o}
  var saved={};try{saved=JSON.parse(localStorage.getItem('adt5a.responses.v1.pg037_sec002')||'{}')||{}}catch(_){}
  var solved=0, html='';
  for(var n=0;n<6;n++){var ok=KEY[n].indexOf(units(saved['fjala-'+(n+1)]).join(''))>=0;if(ok)solved++;
    html+='<span class="p37-tile'+(ok?'':' is-empty')+'" aria-hidden="true">'+(ok?LET[n]:'?')+'</span>'}
  html+='<p class="p37-found-note">'+(solved===6?'Fjala jote: USHQIMI':'Plotëso fjalëkryqin në faqen e mëparshme për ta zbuluar fjalën.')+'</p>';
  box.innerHTML=html;
})();
</script>
