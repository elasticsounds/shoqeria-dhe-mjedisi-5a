<style>
/* Page 46 · Provoje veten. Shared practice components; page-local: a/b/c rows and the word-bubble diagram. */
#content.book.p46 .p46-abc{display:grid;gap:12px;max-width:640px}
#content.book.p46 .p46-abc>div{display:grid;grid-template-columns:2.2em minmax(0,1fr);align-items:center;gap:10px}
#content.book.p46 .p46-abc label{font:600 20px/1.4 var(--book-heading);color:var(--book-ink)}
#content.book.p46 .p46-bubbles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 28px;align-items:start}
#content.book.p46 .p46-bubble{position:relative;display:grid;gap:10px;padding:18px 20px 20px;border:2px solid var(--book-ink);border-radius:40px;background:#fff}
#content.book.p46 .p46-bubble::after{content:"";position:absolute;bottom:-14px;width:24px;height:24px;background:#fff;border-right:2px solid var(--book-ink);border-bottom:2px solid var(--book-ink);transform:rotate(45deg)}
#content.book.p46 .p46-bubble.is-left::after{right:22%}
#content.book.p46 .p46-bubble.is-right::after{left:22%}
#content.book.p46 .p46-bubble.is-low::after{top:-14px;bottom:auto;transform:rotate(225deg)}
#content.book.p46 .p46-bubble.is-center{grid-column:1/-1;justify-self:center;width:min(100%,420px);border-color:#a078b4;border-radius:999px;padding:16px 28px 18px}
#content.book.p46 .p46-bubble.is-center::after{content:none}
#content.book.p46 .p46-bubble label{justify-self:center;font:600 20px/1.3 var(--book-heading);color:var(--book-ink);letter-spacing:.04em}
#content.book.p46 .p46-bubble :is(input,textarea).prx-field{min-height:52px}
#content.book.p46 .p46-bubble textarea.prx-field{min-height:96px}
@media(max-width:700px){
 #content.book.p46 .p46-bubbles{grid-template-columns:minmax(0,1fr);gap:28px}
 #content.book.p46 .p46-bubble{border-radius:28px}
}
</style></head>
